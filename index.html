<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Sin zoom accidental en tablets y móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f4a">
  <meta name="description" content="Astro Sumas: un juego espacial para practicar sumas y restas (6 a 8 años).">
  <title>Astro Sumas: Aventura Espacial</title>

  <!-- Fuente redondeada y muy legible -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

</head>
<body data-screen="start">
  <!-- Escena 3D de fondo -->
  <canvas id="scene" aria-hidden="true"></canvas>

  <!-- Botón de sonido (visible en todas las pantallas) -->
  <button class="btn-icon btn-sound" id="btn-sound" type="button" aria-label="Silenciar sonido"></button>

  <!-- 1. Pantalla de inicio -->
  <section id="screen-start" class="screen active" aria-label="Inicio">
    <div class="start-layout">
      <div class="start-title">
        <div class="title-decor" id="title-decor"></div>
        <h1 class="title">Astro Sumas<span class="subtitle">Aventura Espacial</span></h1>
      </div>
      <div class="start-astronaut" id="start-astronaut"></div>
      <div class="start-actions">
        <button class="btn btn-play" id="btn-play" type="button">¡Jugar!</button>
        <p class="start-hint">Suma y resta para viajar de planeta en planeta</p>
        <p class="webgl-error" id="webgl-error" hidden>Este navegador no puede mostrar gráficos 3D. Prueba con otro navegador.</p>
      </div>
    </div>
  </section>

  <!-- 2. Pantalla de juego -->
  <section id="screen-game" class="screen" aria-label="Juego">
    <header class="topbar">
      <button class="btn-icon" id="btn-pause" type="button" aria-label="Pausa"></button>
      <div class="progress" aria-label="Progreso hacia el siguiente planeta">
        <div class="progress-dest">
          <span class="dest-icon" id="dest-icon"></span>
          <span class="dest-name" id="dest-name"></span>
          <span class="dest-count" id="dest-count"></span>
        </div>
        <div class="progress-track">
          <div class="progress-stars" id="progress-stars"></div>
        </div>
      </div>
      <span class="topbar-spacer"></span>
    </header>

    <div class="question-card empty" aria-live="polite">
      <div class="question" id="question"></div>
    </div>

    <div class="feedback" id="feedback" aria-live="polite">
      <div class="mascot"></div>
      <p class="bubble"></p>
    </div>

    <div class="answers hidden" id="answers"></div>
  </section>

  <!-- 3. Pausa -->
  <section id="screen-pause" class="screen overlay" aria-label="Pausa">
    <div class="panel">
      <div class="panel-mascot" id="pause-mascot"></div>
      <h2>Pausa</h2>
      <p>¡Tómate un respiro, astronauta!</p>
      <div class="panel-buttons">
        <button class="btn btn-primary" id="btn-resume" type="button"><span class="icon"></span>Continuar</button>
        <button class="btn btn-secondary" id="btn-home" type="button"><span class="icon"></span>Inicio</button>
      </div>
    </div>
  </section>

  <!-- 4. Victoria (fin del viaje) -->
  <section id="screen-victory" class="screen overlay" aria-label="Misión cumplida">
    <div class="panel">
      <div class="panel-astronaut" id="victory-astronaut"></div>
      <h2>¡Misión cumplida!</h2>
      <p id="victory-text"></p>
      <div class="panel-buttons">
        <button class="btn btn-primary" id="btn-again" type="button"><span class="icon"></span>¡Otra aventura!</button>
        <button class="btn btn-secondary" id="btn-victory-home" type="button"><span class="icon"></span>Inicio</button>
      </div>
    </div>
  </section>

  <!-- Cartel de llegada a un planeta -->
  <div class="banner" id="banner" aria-live="polite"></div>

  <!-- Scripts clásicos (sin módulos): el juego funciona abriendo index.html
       directamente, sin servidor. El orden importa: cada archivo usa lo que
       definen los anteriores a través de window.AstroSumas. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/illustrations.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/helpers3d.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
